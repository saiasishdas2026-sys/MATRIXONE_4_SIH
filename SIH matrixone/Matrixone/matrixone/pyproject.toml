[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "matrixone"
version = "0.1.0"
description = "AI-Driven Standardization and Harmonization of Material Codes Across CPSEs"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "pgvector>=0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.2.1",
    "celery>=5.4.0",
    "structlog>=4.5.0",
    "python-multipart>=0.0.1",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=4.1.1",
    "httpx>=0.27.0",
    "aiormq>=2.1.2",
    "strawberry-graphql>=0.23.0",
    "re-fuzzy>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.45.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = true